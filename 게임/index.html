<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div>
          <span class="label">점수</span>
          <span id="score">0</span>
        </div>
        <div>
          <span class="label">최고</span>
          <span id="best-score">0</span>
        </div>
        <div>
          <span class="label">코인</span>
          <span id="coins">0</span>
        </div>
        <div>
          <span class="label">챌린지</span>
          <span id="level">1</span>
          <span>/ 10</span>
        </div>
        <div>
          <span class="label">아이템</span>
          <span id="itemStatus">없음</span>
        </div>
      </div>

      <div class="settings" aria-label="게임 설정">
        <label>
          챌린지 단계
          <select id="challengeSelect">
            <option value="" selected disabled>선택하세요</option>
            <option value="1">1단계</option>
            <option value="2">2단계</option>
            <option value="3">3단계</option>
            <option value="4">4단계</option>
            <option value="5">5단계</option>
            <option value="6">6단계</option>
            <option value="7">7단계</option>
            <option value="8">8단계</option>
            <option value="9">9단계</option>
            <option value="10">10단계</option>
          </select>
        </label>
        <label>
          맵 크기
          <select id="mapSizeSelect">
            <option value="15">작게</option>
            <option value="20" selected>보통</option>
            <option value="25">넓게</option>
          </select>
        </label>
        <label>
          속도
          <select id="speedSelect">
            <option value="170">느림</option>
            <option value="120" selected>보통</option>
            <option value="75">빠름</option>
          </select>
        </label>
        <label>
          스킨
          <select id="skinSelect">
            <option value="emerald" selected>에메랄드</option>
            <option value="ocean">오션</option>
            <option value="flame">플레임</option>
            <option value="neon">네온</option>
            <option value="sunset">선셋</option>
            <option value="ice">아이스</option>
            <option value="gold">골드</option>
            <option value="galaxy">갤럭시</option>
          </select>
        </label>
        <div id="skinPreview" class="skin-preview" aria-live="polite">
          <span class="preview-label">구매 전 미리보기</span>
          <span class="preview-snake" aria-hidden="true">
            <i class="preview-head"></i>
            <i class="preview-body"></i>
            <i class="preview-body"></i>
          </span>
          <strong id="skinPreviewName">에메랄드</strong>
          <span id="skinPreviewRarity" class="skin-rarity">일반</span>
        </div>
        <div class="skin-shop" aria-label="스킨 상점">
          <span class="shop-label">스킨 상점</span>
          <button class="skin-buy-button" data-skin="ocean" type="button">오션 · 3코인</button>
          <button class="skin-buy-button" data-skin="flame" type="button">플레임 · 6코인</button>
          <button class="skin-buy-button" data-skin="neon" type="button">네온 · 10코인</button>
          <button class="skin-buy-button" data-skin="sunset" type="button">선셋 · 14코인</button>
          <button class="skin-buy-button" data-skin="ice" type="button">아이스 · 18코인</button>
          <button class="skin-buy-button" data-skin="gold" type="button">골드 · 25코인</button>
          <button class="skin-buy-button" data-skin="galaxy" type="button">갤럭시 · 40코인</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="400" height="400" aria-label="Snake Game"></canvas>
        <div id="countdownOverlay" class="countdown-overlay" aria-live="assertive" hidden></div>
      </div>

      <div class="controls">
        <button id="startButton">게임 시작</button>
        <button id="pauseButton" class="secondary-button" disabled>일시정지</button>
      </div>
      <p id="message" class="message">화살표 키 또는 WASD로 움직이세요</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
